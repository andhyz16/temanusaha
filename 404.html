<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TemanUsaha - Mengalihkan...</title>
  <script>
    // GitHub Pages 404 Trick:
    // Setiap URL seperti /temanusaha/namatoko akan diserve sebagai 404 oleh GitHub Pages.
    // Script ini menangkap path tersebut dan mengalihkan ke /?toko=namatoko
    (function() {
      var base = '/temanusaha';
      var path = window.location.pathname;
      var slug = path.replace(base, '').replace(/^\/+/, '').replace(/\/+$/, '');
      
      // Jika ada slug (bukan hanya path dasar), redirect ke /?toko=slug
      if (slug && slug.length > 0 && slug !== 'index.html' && slug !== '404.html') {
        var search = window.location.search;
        var hash = window.location.hash;
        var redirectUrl = window.location.origin + base + '/?toko=' + encodeURIComponent(slug) + (search ? '&' + search.slice(1) : '') + hash;
        window.location.replace(redirectUrl);
      } else {
        // Tidak ada slug — arahkan ke halaman utama
        window.location.replace(window.location.origin + base + '/');
      }
    })();
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #064e3b, #065f46, #047857);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner"></div>
    <div style="font-size:24px;font-weight:800;margin-bottom:8px">TemanUsaha</div>
    <div style="font-size:14px;opacity:0.8">Membuka halaman toko Anda...</div>
  </div>
</body>
</html>
